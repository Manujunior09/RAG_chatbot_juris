<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>ManuJR - Chatbot RAG</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 900px; margin: auto; padding: 20px; }
        .chat-container { border: 1px solid #ccc; height: 650px; overflow-y: auto; padding: 10px; background: #f9f9f9; border-radius: 8px; }
        .user-message { background: #d1e7dd; text-align: right; margin: 8px; padding: 10px; border-radius: 10px; }
        .bot-message { background: #e2e3e5; text-align: left; margin: 8px; padding: 10px; border-radius: 10px; }
        .sources { font-size: 0.8em; color: #555; margin-top: 5px; border-top: 1px solid #ccc; padding-top: 5px; }
        .time-info { font-size: 0.7em; color: #777; text-align: right; margin-top: 5px; }
        .loader { display: inline-block; width: 20px; height: 20px; border: 2px solid #ccc; border-top-color: #333; border-radius: 50%; animation: spin 0.6s linear infinite; margin-left: 10px; }
        @keyframes spin { to { transform: rotate(360deg); } }
        input, button { padding: 8px; margin: 5px; }
        input { width: 70%; }
    </style>
</head>
<body>
    <h1>RAG_MANU_JUNIOR - Mon assistant juridique personnel</h1>
    <button id="newChat"> Nouvelle conversation</button>
    <div class="chat-container" id="chatLog"></div>
    <div>
        <input type="text" id="questionInput" placeholder="Posez votre question sur le code du numérique ou le code général de l'impôt en République du Bénin." autofocus>
        <button id="askBtn">Envoyer</button>
    </div>
    <div id="loading" style="display:none;"><span class="loader"></span> Recherche en cours...</div>

    <script>
        let sessionId = "{{ session_id }}";

        function addMessage(role, text, sources=null, times=null) {
            const chatDiv = document.getElementById('chatLog');
            const msgDiv = document.createElement('div');
            msgDiv.className = role === 'user' ? 'user-message' : 'bot-message';
            let content = `<strong>${role === 'user' ? 'Vous' : 'Assistant'}</strong><br>${text.replace(/\n/g, '<br>')}`;
            if (sources && sources.length) {
                let srcHtml = '<div class="sources"><strong>📄 Sources :</strong><ul>';
                sources.forEach(s => {
                    srcHtml += `<li>${s.document} (score ${Math.round(s.score*100)}%)<br><small>${s.extrait}...</small></li>`;
                });
                srcHtml += '</ul></div>';
                content += srcHtml;
            } else if (sources !== null) {
                content += '<div class="sources"><em>Aucune source pertinente trouvée.</em></div>';
            }
            if (times) {
                content += `<div class="time-info">🔍 ${times.retrieval} ms | 💬 ${times.llm} ms | ⏱️ total ${times.total} ms</div>`;
            }
            msgDiv.innerHTML = content;
            chatDiv.appendChild(msgDiv);
            chatDiv.scrollTop = chatDiv.scrollHeight;
        }

        async function ask() {
            const input = document.getElementById('questionInput');
            const question = input.value.trim();
            if (!question) return;
            input.value = '';
            addMessage('user', question);

            const loadingDiv = document.getElementById('loading');
            loadingDiv.style.display = 'block';
            try {
                const response = await fetch('/ask', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ question: question, session_id: sessionId })
                });
                const data = await response.json();
                if (data.error) throw new Error(data.error);
                addMessage('bot', data.reponse, data.sources, {
                    retrieval: data.temps_retrieval_ms,
                    llm: data.temps_llm_ms,
                    total: data.temps_total_ms
                });
            } catch (err) {
                addMessage('bot', "⚠️ Erreur : " + err.message);
            } finally {
                loadingDiv.style.display = 'none';
            }
        }

        document.getElementById('askBtn').onclick = ask;
        document.getElementById('questionInput').onkeypress = (e) => { if (e.key === 'Enter') ask(); };
        document.getElementById('newChat').onclick = async () => {
            const resp = await fetch('/new_session', { method: 'POST' });
            const data = await resp.json();
            sessionId = data.session_id;
            document.getElementById('chatLog').innerHTML = '';
            addMessage('bot', 'Nouvelle conversation démarrée. Posez votre question sur le code du numérique.');
        };

        // Bienvenue
        addMessage('bot', 'Bonjour ! Je réponds aux questions à partir du code du numérique et du code général des impôts en République du Bénin.');
    </script>
</body>
</html>
